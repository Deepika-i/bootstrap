<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<style>
    img {
        width: 100%;
        height: 200px;
        /* object-fit: cover; */
    }
</style>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row g-4">

            <!-- Card 1 -->
            <div class="col-md-4">
                <div class="card" style="width: 18rem;">
            <img src="watch.jpeg" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Smart Watch</h5>
                <p class="card-text"> Stylish smartwatch with fitness tracking
                            and notifications.
                        </p>
                <a href="#" class="btn btn-primary">Buy Now</a>
            </div>
        </div>
                
        </div>

             

           <!-- Card 2 -->
                 <div class="col-md-4">
                <div class="card" style="width: 18rem;">
            <img src="head.webp" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Headphones</h5>
                <p class="card-text"> Wireless headphones with clear sound
                            and comfortable design..</p>
                <a href="#" class="btn btn-warning">
                            Buy Now
                        </a>
            </div>
        </div>
                
        </div>


            <!-- Card 3 -->
            <div class="col-md-4">
                <div class="card" style="width: 18rem;">
            <img src="bag.avif" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Backpack</h5>
                <p class="card-text"> Durable and stylish backpack suitable
                            for college and travel..</p>
               <a href="#" class="btn btn-success">
                            Buy Now
                        </a>

          

            </div>

        </div>

    </div>

</body>
</html>
