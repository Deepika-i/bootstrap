<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3 Column Bootstrap Layout</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Our Services</h1>

        <div class="row">

            <!-- Column 1 -->
            <div class="col-md-4">
                <div class="p-4 bg-primary text-white text-center rounded">
                    <h3>Web Design</h3>
                    <p>We create modern and responsive websites.</p>
                </div>
            </div>

            <!-- Column 2 -->
            <div class="col-md-4">
                <div class="p-4 bg-success text-white text-center rounded">
                    <h3>Development</h3>
                    <p>We build fast and user-friendly web applications.</p>
                </div>
            </div>

            <!-- Column 3 -->
            <div class="col-md-4">
                <div class="p-4 bg-warning text-dark text-center rounded">
                    <h3>SEO</h3>
                    <p>We improve website visibility on search engines.</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
