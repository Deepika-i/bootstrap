
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark" style="background-color: #e8a0b5;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">My Dashboard</a>
        </div>
    </nav>


    <!-- Dashboard -->
    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-3 bg-light p-4">

                <h4>Menu</h4>

                <a href="#" class="d-block mb-3">Dashboard</a>
                <a href="#" class="d-block mb-3">Orders</a>
                <a href="#" class="d-block mb-3">Customers</a>
                <a href="#" class="d-block mb-3">Settings</a>

            </div>


            <!-- Main Content -->
            <div class="col-9 p-4">

                <h2>Dashboard</h2>

                <div class="row mt-4">

                    <!-- Orders Card -->
                    <div class="col-md-4 mb-3">
                        <div class="card text-center p-3">
                            <h5>Orders</h5>
                            <h2>150</h2>
                        </div>
                    </div>


                    <!-- Customers Card -->
                    <div class="col-md-4 mb-3">
                        <div class="card text-center p-3">
                            <h5>Customers</h5>
                            <h2>80</h2>
                        </div>
                    </div>


                    <!-- Products Card -->
                    <div class="col-md-4 mb-3">
                        <div class="card text-center p-3">
                            <h5>Products</h5>
                            <h2>45</h2>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
